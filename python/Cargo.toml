[package]
name = "simul-py"
version = "0.7.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Python bindings for the simul deterministic discrete-event simulation and experiment library."
publish = false

[lib]
name = "simul"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.30.1", features = ["extension-module", "abi3-py39"] }
rustc-hash = "2.1.3"
simul_core = { package = "simul", path = "..", features = ["parallel"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "deny", priority = -3 }
pedantic = { level = "warn", priority = -2 }
unwrap_used = "deny"
expect_used = "deny"
cast_precision_loss = "allow"
module_name_repetitions = "allow"
