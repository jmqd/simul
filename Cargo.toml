[package]
name = "simul"
version = "0.6.0"
rust-version = "1.85"
edition = "2021"
authors = ["Jordan McQueen <j@jm.dev>"]
license = "MIT"

keywords = ["sim", "simulation", "optimization", "experiment"]
categories = ["mathematics", "science", "development-tools"]
description = """
A discrete-event simulation library aimed at high-level use-cases to
quickly simulate real-world problems and run simulated experiments.

Some example use cases might include simulating logistics or operations research
problems, running experiments to determine optimal parameters, simulating
queueing systems, distributed systems, performance engineering, and so on.
"""

homepage = "https://github.com/jmqd/simul"
repository = "https://github.com/jmqd/simul"
readme = "README.md"
# Ship sources, tests, examples, benches, and user docs; development tooling
# and local notes stay out of the published package.
include = [
    "/src/**",
    "/tests/**",
    "/examples/**",
    "/benches/**",
    "/README.md",
    "/CHANGELOG.org",
    "/LICENSE",
]

[profile.release]
lto = "fat"
panic = "abort"
strip = true

[lib]
name = "simul"
path = "src/lib.rs"

[features]
default = []
parallel = ["dep:rayon"]

[dev-dependencies]
# Benchmarks and tests require Rust 1.86; the library MSRV remains 1.85.
criterion = "0.8.2"

[[bench]]
name = "benchmarks"
harness = false

[[bench]]
name = "deterministic_search_benchmark"
harness = false


[[bench]]
name = "cross_entropy_benchmark"
harness = false

[[bench]]
name = "instruction_counts"
harness = false

[dependencies]
rand = {version = "0.10.3", features = ["alloc"]}
blake3 = "=1.8.7"
# RustCrypto's ChaCha has a NEON backend; rand_chacha's ppv-lite86 has SIMD
# only on x86_64. Streams are identical; `v1_stream_outputs_are_frozen` pins them.
chacha20 = { version = "=0.10.2", default-features = false, features = ["rng"] }
rayon = { version = "1.12.0", optional = true }
rand_distr = "0.6.0"
dyn-clone = "1.0.20"
rustc-hash = "2.1.3"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "deny"

[lints.clippy]
all = { level = "deny", priority = -3 }
pedantic = { level = "warn", priority = -2 }
nursery = { level = "warn", priority = -1 }

module_name_repetitions = "allow"
cast_precision_loss = "allow"
integer_division = "deny"
checked_conversions = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
float_cmp = "deny"
unchecked_time_subtraction = "deny"
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
wildcard_enum_match_arm = "deny"
clone_on_copy = "deny"
redundant_closure_for_method_calls = "deny"
missing_docs_in_private_items = "warn"
too_many_lines = "warn"

