disallowed-types = [
    { path = "std::collections::HashMap", reason = "use rustc_hash::FxHashMap: faster on short keys, and keys are caller-chosen, so HashDoS resistance is not needed" },
    { path = "std::collections::HashSet", reason = "use rustc_hash::FxHashSet: faster on short keys, and keys are caller-chosen, so HashDoS resistance is not needed" },
]
